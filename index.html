<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#102a43">
    <meta name="description" content="A clear, focused weather dashboard for the places that matter to you.">
    <title>Skyline Weather</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app-shell">
        <header class="topbar">
            <a class="brand" href="./" aria-label="Skyline Weather home"><span class="brand-mark">S</span><span>Skyline</span></a>
            <div class="top-actions"><button class="text-button" id="language-button" type="button">عربي</button><button class="icon-button" id="unit-button" type="button">°C</button><button class="icon-button" id="favorites-button" type="button" aria-label="Show saved places" aria-expanded="false">♡</button></div>
        </header>
        <section class="intro">
            <div><p class="eyebrow" data-i18n="eyebrow">Live weather intelligence</p><h1 data-i18n="title">Weather, made clear.</h1><p class="intro-copy" data-i18n="subtitle">Know what the sky has planned for your day.</p></div>
            <form class="search-form" id="search-form"><label class="sr-only" for="city-input">City name</label><input id="city-input" type="search" autocomplete="off" placeholder="Search for a city..."><button class="search-button" type="submit"><img src="search.png" alt=""><span data-i18n="search">Search</span></button></form>
        </section>
        <p class="status" id="status-message" role="status" hidden></p>
        <section class="dashboard" id="dashboard" aria-busy="false">
            <article class="hero-card"><div class="hero-heading"><div><p class="eyebrow" id="updated">Day · --:--</p><h2 id="city-name">London</h2><p class="country" id="country-name">GB</p></div><button class="save-button" id="save-button" type="button" data-i18n="addFavorite">Save place</button></div><div class="current-weather"><img id="weather-icon" src="clear.png" alt="Clear sky"><div><p class="condition" id="condition">Clear sky</p><p class="temperature" id="temperature">--°C</p><p class="feels-like" id="feels-like">Feels like --°C</p></div></div><div class="sun-times"><div><span class="sun-dot sunrise"></span><span data-i18n="sunrise">Sunrise</span><strong id="sunrise">--:--</strong></div><div><span class="sun-dot sunset"></span><span data-i18n="sunset">Sunset</span><strong id="sunset">--:--</strong></div></div></article>
            <div class="metrics-grid"><article class="metric-card"><span class="metric-icon">◌</span><p data-i18n="humidity">Humidity</p><strong id="humidity">--</strong></article><article class="metric-card"><span class="metric-icon">⌁</span><p data-i18n="wind">Wind</p><strong id="wind">--</strong></article><article class="metric-card"><span class="metric-icon">◉</span><p data-i18n="pressure">Pressure</p><strong id="pressure">--</strong></article><article class="metric-card"><span class="metric-icon">⊙</span><p data-i18n="visibility">Visibility</p><strong id="visibility">--</strong></article></div>
            <section class="forecast-section"><div class="section-heading"><h2 data-i18n="hourly">Hourly forecast</h2><button class="location-button" id="location-button" type="button" data-i18n="useLocation">Use my location</button></div><div class="hourly-list" id="hourly-list"></div></section>
            <section class="forecast-section daily-section"><div class="section-heading"><h2 data-i18n="daily">5-day outlook</h2></div><div class="daily-list" id="daily-list"></div></section>
        </section>
        <aside class="favorites-panel" id="favorites-panel" hidden><div class="section-heading"><h2 data-i18n="favorites">Saved places</h2><button class="close-button" type="button" aria-label="Close" onclick="document.querySelector('#favorites-panel').hidden = true">×</button></div><div id="favorites-list"></div></aside>
    </main>
    <script src="app.js" type="module"></script>
</body>
</html>
